            --correct-text: #155724;
            --wrong-bg: #f8d7da;
            --wrong-border: #f5c6cb;

        /* QUIZ SCREEN */
        #quiz-screen { display: none; }

        /* Controls */
        .controls { display: flex; flex-wrap: wrap; gap: 15px; padding-bottom: 20px; border-bottom: 1px solid var(--border-color); align-items: center; }
        button, .btn { background-color: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: 600; transition: background 0.2s; font-size: 14px;}
        button:hover:not(:disabled), .btn:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        input[type="number"] { padding: 9px; border: 1px solid var(--border-color); border-radius: 5px; width: 80px; }

        /* Dropdowns */
        .dropdown { position: relative; display: inline-block; }
        .dropdown-btn { background: white; color: var(--text-main); border: 1px solid var(--border-color); padding: 10px 15px; border-radius: 5px; cursor: pointer; }
        .dropdown-content { display: none; position: absolute; background: white; min-width: 200px; box-shadow: 0px 8px 16px rgba(0,0,0,0.2); z-index: 10; border: 1px solid var(--border-color); border-radius: 5px; max-height: 300px; overflow-y: auto; }
        .dropdown-content.show { display: block; }
        .dropdown-content label { display: block; padding: 10px 15px; cursor: pointer; font-size: 14px; }
        .dropdown-content label:hover { background-color: #f9f9f9; }

        /* Question UI */
        .status-bar { display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 15px; }
        .question-text { font-size: 1.4rem; font-weight: 600; margin-bottom: 15px; line-height: 1.4;}
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { background: white; border: 2px solid var(--border-color); color: var(--text-main); padding: 15px; border-radius: 8px; transition: all 0.2s; cursor: pointer; text-align: left; font-size: 1rem;}
        .option-btn:hover:not(:disabled) { background: var(--option-hover); }
        .option-btn:disabled { cursor: default; }
        .option-btn.correct { background: var(--correct-bg); border-color: var(--correct-border); color: var(--correct-text); font-weight: bold;}
        .option-btn.wrong { background: var(--wrong-bg); border-color: var(--wrong-border); color: var(--wrong-text); }
        .feedback-area { margin-top: 20px; padding: 15px; border-radius: 5px; display: none; text-align: center; font-weight: bold; }
        .correct-msg { background-color: var(--correct-bg); color: var(--correct-text); border: 1px solid var(--correct-border); }
        .wrong-msg { background-color: var(--wrong-bg); color: var(--wrong-text); border: 1px solid var(--wrong-border); }
        
        /* Navigation */
        .nav-container { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border-color);}
        
        /* Wrong Navigation */
        .nav-container-wrong { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .wrong-nav-btn { background-color: #fff; color: var(--wrong-text); border: 2px solid var(--wrong-border); }
        .wrong-nav-btn:hover:not(:disabled) { background-color: var(--wrong-bg); }

        /* Stats Area */
        .stats-area { background: #f8f9fa; border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; text-align: center; margin-top: 10px;}
        .stats-area h3 { margin: 0 0 10px 0; font-size: 1.1rem; color: var(--primary);}
        .stats-row { display: flex; justify-content: center; gap: 20px; font-weight: bold; margin-bottom: 15px; flex-wrap: wrap;}
        .stat-item { padding: 5px 10px; border-radius: 5px; }
        .stat-right { color: var(--correct-text); background: var(--correct-bg); }
        .stat-wrong { color: var(--wrong-text); background: var(--wrong-bg); }
        .reset-btn { background-color: #dc3545; font-size: 0.9rem;}
        .reset-btn:hover:not(:disabled) { background-color: #c82333; }

        /* Wrong Answers List */
        details.wrong-answers { background: #fff; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; margin-top: 15px; text-align: left; }
        summary { font-weight: bold; cursor: pointer; color: var(--wrong-text); outline: none; user-select: none; }
        .wrong-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .wrong-pill { background: var(--wrong-bg); color: var(--wrong-text); border: 1px solid var(--wrong-border); padding: 6px 12px; border-radius: 15px; cursor: pointer; font-size: 0.9rem; transition: 0.2s; font-weight: bold;}

        /* Footer */
        .app-footer { text-align: center; font-size: 0.8rem; color: #999; margin-top: 20px; }

</head>

        <div id="feedback" class="feedback-area"></div>
        
        <div class="nav-container">
            <button id="prev-btn" onclick="prevQuestion()">&larr; Zurück</button>
            <button onclick="getRandomQuestion()">Zufällige Frage</button>
            <button id="next-btn" onclick="nextQuestion()">Nächste Frage &rarr;</button>

        <!-- WRONG QUESTION NAVIGATION -->

        </div>

            <button class="reset-btn" onclick="resetStats()">Statistiken zurücksetzen</button>

                </div>

    <!-- FOOTER VERSION -->

</div>

    let allQuestions = [];
    let filteredQuestions = [];
    let currentIndex = 0;
    let currentQuestion = null;

    // --- LOAD SAVED STATE ---
    let savedState = JSON.parse(localStorage.getItem('einbuergerung_quiz_state')) || {
        lastId: null,
        wrongIds: [],
        stats: { total: 0, right: 0, wrong: 0 }
    };

    let wrongIds = new Set(savedState.wrongIds);
    let stats = savedState.stats;

    function saveState() {
        const stateToSave = {
            lastId: currentQuestion ? currentQuestion.globalId : null,
            wrongIds: Array.from(wrongIds),
            stats: stats
        };
        localStorage.setItem('einbuergerung_quiz_state', JSON.stringify(stateToSave));
    }

    // --- INITIALIZATION ---
    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('app-version').textContent = APP_VERSION;
        initializeQuiz(quizData);
    });

    function initializeQuiz(data) {
        allQuestions = data.map((q, index) => ({ ...q, globalId: index + 1 }));
        filteredQuestions = [...allQuestions];
        populateFilters();
        
        document.getElementById('quiz-screen').style.display = 'block';
        
        updateStatsUI();
        renderWrongIds();

        // Restore last question if exists
        if (savedState.lastId) {
            const idx = allQuestions.findIndex(q => q.globalId === savedState.lastId);
            if (idx !== -1) {
                loadQuestion(idx);
                return;
            }
        }
        loadQuestion(0);
    }

    // --- DROPDOWN FILTERS ---
    function populateFilters() {
        const topics = new Set(allQuestions.map(q => q.Topic));
        const areas = new Set(allQuestions.map(q => q.Area));
        const topicBox = document.getElementById('topic-dropdown');
        topics.forEach(t => topicBox.innerHTML += `<label><input type="checkbox" value="${t}" class="filter-topic" onchange="applyFilters()"> ${t}</label>`);
        const areaBox = document.getElementById('area-dropdown');
        areas.forEach(a => areaBox.innerHTML += `<label><input type="checkbox" value="${a}" class="filter-area" onchange="applyFilters()"> ${a}</label>`);
    }

    function toggleDropdown(id) { document.getElementById(id).classList.toggle('show'); }

    // Close dropdowns if clicking outside
    window.onclick = function(event) {
        if (!event.target.matches('.dropdown-btn')) {
            document.querySelectorAll('.dropdown-content').forEach(d => d.classList.remove('show'));
        }
    }

    function applyFilters() {
        const t = Array.from(document.querySelectorAll('.filter-topic:checked')).map(cb => cb.value);
        const a = Array.from(document.querySelectorAll('.filter-area:checked')).map(cb => cb.value);
        filteredQuestions = allQuestions.filter(q => (t.length === 0 || t.includes(q.Topic)) && (a.length === 0 || a.includes(q.Area)));
        if (filteredQuestions.length === 0) { alert("Keine Fragen gefunden."); resetFilters(); } 
        else { loadQuestion(0); }
    }

    function resetFilters() {
        document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
        filteredQuestions = [...allQuestions];
        loadQuestion(0);
    }

    // --- QUESTION LOGIC ---
    function loadQuestion(index) {
        currentIndex = index;
        currentQuestion = filteredQuestions[currentIndex];
        
        // Save current view state
        saveState();

        // Reset Feedback
        document.getElementById('feedback').style.display = 'none';
        
        // Setup Navigation Buttons
        document.getElementById('prev-btn').disabled = (currentIndex === 0);
        document.getElementById('next-btn').disabled = (currentIndex === filteredQuestions.length - 1);
        
        // Setup Option Buttons
        ['a', 'b', 'c', 'd'].forEach(l => {
            const btn = document.getElementById(`btn-${l}`);
            btn.disabled = false;
            btn.className = 'option-btn';
            
            const optionText = currentQuestion[`Option ${l.toUpperCase()}`];
            if (optionText) {
                btn.textContent = `${l.toUpperCase()}) ${optionText}`;
                btn.style.display = 'block';
            } else {
                btn.style.display = 'none';
            }
        });

        // Setup Meta Data
        document.getElementById('question-text').textContent = currentQuestion.Question;
        document.getElementById('question-tags').textContent = `${currentQuestion.Topic} / ${currentQuestion.Area}`;
        document.getElementById('question-counter').textContent = `Frage ${currentIndex + 1} von ${filteredQuestions.length}`;
        document.getElementById('global-id').textContent = currentQuestion.globalId;

        // Setup Image if applicable
        const imgCont = document.getElementById('image-container');
        imgCont.innerHTML = '';
        if (currentQuestion["Needs Picture"] && currentQuestion["Picture Files"]) {
            currentQuestion["Picture Files"].split(',').forEach(f => {
                const img = document.createElement('img');
                img.src = `assets/${f.trim()}`;
                img.style.maxWidth = '100%';
                img.style.maxHeight = '400px';
                img.style.marginBottom = '15px';
                img.style.border = '1px solid var(--border-color)';
                img.style.borderRadius = '5px';
                img.style.display = 'block';
                imgCont.appendChild(img);
            });
        }
    }

    function checkAnswer(user) {
        // Lock options
        ['a', 'b', 'c', 'd'].forEach(l => document.getElementById(`btn-${l}`).disabled = true);
        
        const correct = currentQuestion.Answer.toLowerCase();
        const isCorrect = (user === correct);
        
        // Highlight correct answer
        document.getElementById(`btn-${correct}`).classList.add('correct');
        
        const fb = document.getElementById('feedback');
        fb.style.display = 'block';
        
        if (isCorrect) {
            fb.textContent = "Korrekt!";
            fb.className = "feedback-area correct-msg";
            stats.right++;
            // Remove from wrong list if it was there
            wrongIds.delete(currentQuestion.globalId);
        } else {
            // Highlight wrong choice
            document.getElementById(`btn-${user}`).classList.add('wrong');
            fb.textContent = `Falsch. Richtige Antwort: ${currentQuestion[`Option ${correct.toUpperCase()}`]}`;
            fb.className = "feedback-area wrong-msg";
            stats.wrong++;
            // Add to wrong list
            wrongIds.add(currentQuestion.globalId);
        }

        stats.total++;
        updateStatsUI();
        renderWrongIds();
        saveState();
    }

    // --- WRONG ANSWERS LOGIC ---
    function renderWrongIds() {
        document.getElementById('wrong-count').textContent = wrongIds.size;
        const container = document.getElementById('wrong-pills');
        const wrongNavContainer = document.getElementById('wrong-nav-container');
        container.innerHTML = '';
        
        // Sort IDs for better presentation
        const sortedIds = Array.from(wrongIds).sort((a, b) => a - b);
        
        if (sortedIds.length === 0) {
            container.innerHTML = '<span style="color: var(--text-muted); font-weight: normal; font-size: 0.9rem;">Keine falschen Antworten!</span>';
            wrongNavContainer.style.display = 'none'; // Hide buttons if no wrong answers
        } else {
            sortedIds.forEach(id => {
                const pill = document.createElement('div');
                pill.className = 'wrong-pill';
                pill.textContent = `Frage ${id}`;
                pill.onclick = () => jumpToGlobalId(id);
                container.appendChild(pill);
            });
            wrongNavContainer.style.display = 'flex'; // Show buttons
        }
    }

    // --- STATS LOGIC ---
    function updateStatsUI() {
        document.getElementById('stat-total').textContent = stats.total;
        document.getElementById('stat-right').textContent = stats.right;
        document.getElementById('stat-wrong').textContent = stats.wrong;
        
        const percent = stats.total > 0 ? Math.round((stats.right / stats.total) * 100) : 0;
        document.getElementById('stat-percent').textContent = percent;
    }

    function resetStats() {
        if(confirm("Möchten Sie Ihre Statistiken und die Liste der falschen Fragen wirklich zurücksetzen?")) {
            stats = { total: 0, right: 0, wrong: 0 };
            wrongIds.clear();
            updateStatsUI();
            renderWrongIds();
            saveState();
        }
    }

    // --- NAVIGATION ---
    function prevQuestion() { 
        if(currentIndex > 0) loadQuestion(currentIndex - 1); 
    }
    
    function nextQuestion() { 
        if(currentIndex + 1 < filteredQuestions.length) loadQuestion(currentIndex + 1); 
    }
    
    function getRandomQuestion() { 
        loadQuestion(Math.floor(Math.random() * filteredQuestions.length)); 
    }
    
    function jumpToQuestion() {
        const id = parseInt(document.getElementById('jump-input').value);
        if (isNaN(id)) return;
        jumpToGlobalId(id);
        document.getElementById('jump-input').value = '';
    }

    function jumpToGlobalId(id) {
        // Jumping clears active filters to ensure we can reach the question
        resetFilters();
        const idx = allQuestions.findIndex(q => q.globalId === id);
        if(idx !== -1) {
            loadQuestion(idx);
        } else {
            alert("ID nicht gefunden.");
        }
    }

    function nextWrongQuestion() {
        const sortedIds = Array.from(wrongIds).sort((a, b) => a - b);
        if (sortedIds.length === 0) return;

        const currentGlobalId = currentQuestion ? currentQuestion.globalId : 0;
        
        let nextId = sortedIds.find(id => id > currentGlobalId);
        
        if (nextId === undefined) {
            nextId = sortedIds[0];
        }
        
        jumpToGlobalId(nextId);
    }

    function prevWrongQuestion() {
        const sortedIds = Array.from(wrongIds).sort((a, b) => a - b);
        if (sortedIds.length === 0) return;

        const currentGlobalId = currentQuestion ? currentQuestion.globalId : Number.MAX_SAFE_INTEGER;
        
        const reversedIds = [...sortedIds].reverse();
        let prevId = reversedIds.find(id => id < currentGlobalId);
        
        if (prevId === undefined) {
            prevId = reversedIds[0];
        }
        
        jumpToGlobalId(prevId);
    }

    function getRandomWrongQuestion() {
        const ids = Array.from(wrongIds);
        if (ids.length === 0) return;
        const randomId = ids[Math.floor(Math.random() * ids.length)];
        jumpToGlobalId(randomId);
    }
</script>
